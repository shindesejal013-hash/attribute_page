
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Attributes Task</title>
</head>
<body>

    <h1 id="main-heading" class="heading"
        title="This is the main heading">
        HTML Attributes Demonstration
    </h1>

    <p id="intro" style="color: blue;">
        Learning HTML attributes.
    </p>

    <a href="https://www.google.com"
       target="_blank"
       title="Open Google">
        Visit Google
    </a>

    <br><br>

    <img src="https://placehold.co/200x120"
         alt="Sample placeholder image"
         width="200"
         height="120">

    <br><br>

    <form>
        <label for="student-name">Student Name:</label>

        <input type="text"
               id="student-name"
               name="studentName"
               placeholder="Enter your name"
               required>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
